spring.application.name=mpc-backend-test

# In-memory H2 for isolated test suite
spring.datasource.url=jdbc:h2:mem:mpctest;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false

app.jwt.secret=SolarSaaS-Development-Secret-Key-Change-In-Production-2026
app.jwt.expiration-ms=86400000
server.port=8081