spring.application.name=mpc-backend

# PostgreSQL Database Configuration (Persistent Storage)
spring.datasource.url=jdbc:postgresql://localhost:5432/solarsaas
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.username=postgres
spring.datasource.password=1234
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

spring.h2.console.enabled=false

app.jwt.secret=SolarSaaS-Development-Secret-Key-Change-In-Production-2026
app.jwt.expiration-ms=86400000
        
server.port=8081

# Spring Mail Configuration (Environment variables only)
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:solarsaas.project@gmail.com}
spring.mail.password=${MAIL_PASSWORD:dylhciutfmskoksd}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.connectiontimeout=20000
spring.mail.properties.mail.smtp.timeout=20000
spring.mail.properties.mail.smtp.writetimeout=20000

# Google Solar & Maps API Configuration (Environment Variables with NO secret defaults)
google.solar.api.key=${GOOGLE_SOLAR_API_KEY:}
google.maps.api.key=${GOOGLE_MAPS_SERVER_KEY:${GOOGLE_MAPS_API_KEY:}}

# OpenAI API Configuration (Environment Variables)
openai.api.key=${OPENAI_API_KEY:}
openai.model=${OPENAI_MODEL:gpt-4o-mini}

# Cloud HTTPS Email Provider API Keys (Render-compatible over Port 443)
resend.api.key=${RESEND_API_KEY:}
brevo.api.key=${BREVO_API_KEY:}

# Tripo3D AI V3 Configuration
tripo.api.key=${TRIPO_API_KEY:}
tripo.api.base-url=${TRIPO_API_BASE_URL:https://openapi.tripo3d.ai/v3}
tripo.api.polling-interval-ms=2500
tripo.api.max-polling-seconds=120

# Meshy AI V1 Configuration (Meshy 7.1 Flagship)
meshy.api.key=${MESHY_API_KEY:}
meshy.api-key=${MESHY_API_KEY:}
meshy.base-url=${MESHY_API_BASE_URL:https://api.meshy.ai/openapi/v1}
meshy.mock-enabled=
meshy.ai-model=${MESHY_AI_MODEL:meshy-7.1}
meshy.topology=${MESHY_TOPOLOGY:triangle}
meshy.target-polycount=${MESHY_TARGET_POLYCOUNT:60000}
meshy.should-remesh=${MESHY_SHOULD_REMESH:true}
meshy.should-texture=${MESHY_SHOULD_TEXTURE:true}
meshy.enable-pbr=${MESHY_ENABLE_PBR:false}
meshy.image-enhancement=${MESHY_IMAGE_ENHANCEMENT:false}
meshy.polling-interval-seconds=${MESHY_POLLING_INTERVAL_SECONDS:5}
meshy.max-jobs-per-user-per-day=${MESHY_MAX_JOBS_PER_USER_PER_DAY:10}
meshy.max-global-jobs-per-day=${MESHY_MAX_GLOBAL_JOBS_PER_DAY:50}

# Rooftop Imagery & Local GLB Storage
rooftop.imagery.google-static.enabled=${ROOFTOP_IMAGERY_GOOGLE_STATIC_ENABLED:false}
rooftop.imagery.google-static.key=${GOOGLE_MAPS_SERVER_KEY:}
rooftop.storage.glb-dir=${ROOFTOP_STORAGE_GLB_DIR:uploads/models3d}

