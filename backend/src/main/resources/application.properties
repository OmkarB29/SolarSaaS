spring.application.name=mpc-backend

# In-memory H2 Database for local development and testing
spring.datasource.url=jdbc:h2:mem:mpc;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# PostgreSQL Database Configuration (Production / Persistent)
# spring.datasource.url=jdbc:postgresql://localhost:5432/solarsaas
# spring.datasource.driver-class-name=org.postgresql.Driver
# spring.datasource.username=postgres
# spring.datasource.password=1234
# spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

app.jwt.secret=SolarSaaS-Development-Secret-Key-Change-In-Production-2026
app.jwt.expiration-ms=86400000
        
server.port=8081
