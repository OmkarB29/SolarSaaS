spring.application.name=mpc-backend

# PostgreSQL Database Configuration (Persistent Storage)
spring.datasource.url=jdbc:postgresql://localhost:5432/solarsaas
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.username=postgres
spring.datasource.password=1234
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

spring.h2.console.enabled=false

app.jwt.secret=SolarSaaS-Development-Secret-Key-Change-In-Production-2026
app.jwt.expiration-ms=86400000
        
server.port=8081
